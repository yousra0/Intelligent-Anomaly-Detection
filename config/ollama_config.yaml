# config/ollama_config.yaml
# ============================================================
# Configuration de l'intégration Ollama pour la détection de fraudes
# ============================================================

# ── Serveur Ollama ───────────────────────────────────────────
server:
  base_url: "http://localhost:11434"   # URL par défaut d'Ollama en local
  timeout: 60           #120               # Secondes max par requête

# ── Modèle LLM ──────────────────────────────────────────────
model:
  name: "llama3"    #llama3                    # Modèle principal (ollama pull llama3)
  fallback: "mistral"                   # Modèle de secours (ollama pull mistral)

# ── Paramètres de génération ─────────────────────────────────
generation:
  temperature: 0.2 #0.1                      # Faible = réponses cohérentes/déterministes
  max_tokens: 256   #  512                  # Limite de tokens en sortie
  top_p: 0.9                            # Nucleus sampling

# ── Pipeline d'explication ───────────────────────────────────
pipeline:
  top_k_features: 3                     # Nombre de features à inclure dans l'explication
  max_explain: 10     #50                  # Nombre max de transactions à expliquer par run
  batch_verbose: true                   # Afficher la progression pendant le batch

# ── Sorties ──────────────────────────────────────────────────
output:
  explanations_file: "outputs/reports/explanations.json"
  summary_file:      "outputs/reports/ollama_summary.json"
  figures_dir:       "outputs/figures/"




